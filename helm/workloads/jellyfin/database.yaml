apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: seasonvar-postgres-local
  namespace: media
spec:
  instances: 1
  bootstrap:
    initdb:
      database: seasonvar
      owner: seasonvar
  storage:
    storageClass: local-path
    size: 1Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kino-postgres-local
  namespace: media
spec:
  instances: 1
  bootstrap:
    initdb:
      database: kino
      owner: kino
  storage:
    storageClass: local-path
    size: 1Gi
