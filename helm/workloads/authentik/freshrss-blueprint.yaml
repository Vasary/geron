apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-freshrss
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
    blueprints.goauthentik.io/instantiate: "true"
data:
  freshrss.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: vasary-freshrss-oauth
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.group
        id: freshrss-users-group
        state: present
        identifiers:
          name: freshrss-users
        attrs:
          name: freshrss-users
      - model: authentik_providers_oauth2.oauth2provider
        id: freshrss-oauth-provider
        state: present
        identifiers:
          name: freshrss
        attrs:
          name: freshrss
          client_type: confidential
          client_id: freshrss
          client_secret: !Env [FRESHRSS_OAUTH_CLIENT_SECRET, ""]
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          redirect_uris:
            - matching_mode: strict
              url: https://rss.vasary.org/i/oidc/
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://rss.vasary.org:443/i/oidc/
              redirect_uri_type: authorization
          sub_mode: user_email
          issuer_mode: per_provider
      - model: authentik_core.application
        id: freshrss-application
        state: present
        identifiers:
          slug: freshrss
        attrs:
          name: FreshRSS
          slug: freshrss
          provider: !KeyOf freshrss-oauth-provider
          policy_engine_mode: any
          meta_launch_url: https://rss.vasary.org/
          open_in_new_tab: true
      - model: authentik_policies.policybinding
        id: freshrss-users-policy-binding
        state: present
        identifiers:
          target: !KeyOf freshrss-application
          group: !KeyOf freshrss-users-group
          order: 0
        attrs:
          target: !KeyOf freshrss-application
          group: !KeyOf freshrss-users-group
          order: 0
