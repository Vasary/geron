apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-backup
  namespace: vaultwarden
spec:
  schedule: "15 3 * * *"
  timeZone: Europe/Berlin
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: vaultwarden-backup
              image: vaultwarden/server:1.37.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  (
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  target_dir=/backup-work/vaultwarden
                  mkdir -p "$target_dir"

                  before="$(mktemp)"
                  after="$(mktemp)"
                  find /data -maxdepth 1 -type f -name 'db_*.sqlite3' -print | sort > "$before"
                  /vaultwarden backup
                  find /data -maxdepth 1 -type f -name 'db_*.sqlite3' -print | sort > "$after"

                  db_backup="$(comm -13 "$before" "$after" | tail -n 1)"
                  test -n "$db_backup"
                  mv "$db_backup" "$target_dir/vaultwarden-db-$stamp.sqlite3"

                  tar \
                    --exclude='./db.sqlite3' \
                    --exclude='./db.sqlite3-shm' \
                    --exclude='./db.sqlite3-wal' \
                    --exclude='./db_*.sqlite3' \
                    -czf "$target_dir/vaultwarden-data-$stamp.tar.gz" \
                    -C /data .

                  ) || { touch /backup-work/.failed; exit 1; }
                  touch /backup-work/.done
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backup-work
                  mountPath: /backup-work
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
            - name: sftp-upload
              image: rclone/rclone:1.68
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - secretRef:
                    name: sftp-backup-credentials
              command:
                - /bin/sh
                - -ec
                - |
                  while [ ! -f /backup-work/.done ]; do
                    if [ -f /backup-work/.failed ]; then
                      exit 1
                    fi
                    sleep 5
                  done
                  export RCLONE_CONFIG_BACKUP_TYPE=sftp
                  export RCLONE_CONFIG_BACKUP_HOST="$SFTP_HOST"
                  export RCLONE_CONFIG_BACKUP_PORT="$SFTP_PORT"
                  export RCLONE_CONFIG_BACKUP_USER="$SFTP_USER"
                  export RCLONE_CONFIG_BACKUP_PASS="$(rclone obscure "$SFTP_PASSWORD")"
                  rclone copy /backup-work backup:/ --create-empty-src-dirs --stats-one-line
              volumeMounts:
                - name: backup-work
                  mountPath: /backup-work
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: vaultwarden-data
            - name: backup-work
              emptyDir: {}
