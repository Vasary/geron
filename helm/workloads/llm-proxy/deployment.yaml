apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-proxy
  namespace: llm-proxy
  labels:
    app.kubernetes.io/name: llm-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-proxy
    spec:
      enableServiceLinks: false
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.98.0
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/litellm/config.yaml
            - --host
            - 0.0.0.0
            - --port
            - "4000"
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: llm-proxy-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: llm-proxy-postgres-local-app
                  key: uri
            - name: PROXY_BASE_URL
              value: https://llm-proxy.vasary.org
            - name: GENERIC_AUTHORIZATION_ENDPOINT
              value: https://auth.vasary.org/application/o/authorize/
            - name: GENERIC_TOKEN_ENDPOINT
              value: http://authentik-server.authentik.svc.cluster.vasary.org/application/o/token/
            - name: GENERIC_USERINFO_ENDPOINT
              value: http://authentik-server.authentik.svc.cluster.vasary.org/application/o/userinfo/
            - name: GENERIC_SCOPE
              value: openid profile email litellm_role
            - name: GENERIC_USER_ID_ATTRIBUTE
              value: sub
            - name: GENERIC_USER_EMAIL_ATTRIBUTE
              value: email
            - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
              value: name
            - name: GENERIC_USER_ROLE_ATTRIBUTE
              value: litellm_role
            - name: PROXY_LOGOUT_URL
              value: https://auth.vasary.org/application/o/llm-proxy/end-session/
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: llm-proxy-config
