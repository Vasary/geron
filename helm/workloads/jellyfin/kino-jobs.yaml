apiVersion: batch/v1
kind: CronJob
metadata:
  name: kino-sync
  namespace: media
  labels:
    app.kubernetes.io/name: kino
    app.kubernetes.io/component: sync
spec:
  schedule: "15 * * * *"
  timeZone: Europe/Berlin
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kino
            app.kubernetes.io/component: sync
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-vasary
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: kino
              image: ghcr.io/vasary/go-kino:v0.1.6
              imagePullPolicy: Always
              args:
                - sync
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: kino-postgres-local-app
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: kino-postgres-local-app
                      key: password
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: kino-postgres-local-app
                      key: dbname
                - name: DATABASE_URL
                  value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@kino-postgres-local-rw.media.svc.cluster.vasary.org:5432/$(POSTGRES_DB)?sslmode=disable
                - name: JELLYFIN_URL
                  value: http://jellyfin.media.svc.cluster.vasary.org
                - name: JELLYFIN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: seasonvar-jellyfin
                      key: JELLYFIN_API_KEY
                - name: STREAM_SIGNING_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: seasonvar-jellyfin
                      key: JELLYFIN_API_KEY
                - name: LIBRARY_PATH
                  value: /kino
                - name: PUBLIC_URL
                  value: https://kino-stream.vasary.org
                - name: KINOGO_BASE_URL
                  value: https://kinogo.online
                - name: CATALOG_URL
                  value: /novinki/
                - name: CATALOG_PAGES
                  value: "1"
                - name: SYNC_WORKERS
                  value: "2"
                - name: SYNC_TIMEOUT
                  value: 30m
                - name: REQUEST_PACING
                  value: 500ms
                - name: SYNC_REQUEST_DELAY_MIN
                  value: 100ms
                - name: SYNC_REQUEST_DELAY_MAX
                  value: 500ms
                - name: TZ
                  value: Europe/Berlin
              volumeMounts:
                - name: library
                  mountPath: /kino
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: library
              persistentVolumeClaim:
                claimName: kino-media
---
