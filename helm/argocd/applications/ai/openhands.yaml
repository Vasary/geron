apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openhands
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: ai-platform
  source:
    repoURL: https://github.com/Vasary/geron.git
    targetRevision: master
    path: helm/workloads/openhands/agent-canvas-chart
    helm:
      releaseName: openhands
      valueFiles:
        - values-vasary.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: openhands
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
