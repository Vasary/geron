apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../platform/components/sftp-backup-uploader
  - ../../platform/components/deployment-history-limit
resources:
  - database.yaml
  - redis.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - backup.yaml
  - ai-metadata-cronjob.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: paperless-ai-metadata-script
    namespace: paperless
    files:
      - paperless-ai-metadata.py
