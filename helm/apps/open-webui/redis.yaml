apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: open-webui-redis
  namespace: open-webui
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.15
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    service:
      serviceType: ClusterIP
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
