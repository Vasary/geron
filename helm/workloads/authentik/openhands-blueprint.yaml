apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-openhands
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
    blueprints.goauthentik.io/instantiate: "true"
data:
  openhands.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: vasary-openhands-proxy
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.group
        id: openhands-users-group
        state: present
        identifiers:
          name: openhands-users
        attrs:
          name: openhands-users
      - model: authentik_providers_proxy.proxyprovider
        id: openhands-proxy-provider
        state: present
        identifiers:
          name: openhands
        attrs:
          name: openhands
          mode: forward_single
          grant_types:
            - authorization_code
          external_host: https://openhands.vasary.org
          internal_host: http://openhands.openhands.svc.cluster.vasary.org:8000
          internal_host_ssl_validation: true
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          cookie_domain: vasary.org
          redirect_uris:
            - matching_mode: strict
              url: https://openhands.vasary.org/outpost.goauthentik.io/callback?X-authentik-auth-callback=true
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://openhands.vasary.org?X-authentik-auth-callback=true
              redirect_uri_type: authorization
      - model: authentik_core.application
        id: openhands-application
        state: present
        identifiers:
          slug: openhands
        attrs:
          name: OpenHands
          slug: openhands
          provider: !KeyOf openhands-proxy-provider
          policy_engine_mode: any
          meta_launch_url: https://openhands.vasary.org/
          open_in_new_tab: true
      - model: authentik_policies.policybinding
        id: openhands-users-policy-binding
        state: present
        identifiers:
          target: !KeyOf openhands-application
          group: !KeyOf openhands-users-group
          order: 0
        attrs:
          target: !KeyOf openhands-application
          group: !KeyOf openhands-users-group
          order: 0
