apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-kino
  namespace: authentik
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprint
    blueprints.goauthentik.io/instantiate: "true"
data:
  kino.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: vasary-kino-proxy
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.group
        id: kino-users-group
        state: present
        identifiers:
          name: kino-users
        attrs:
          name: kino-users
      - model: authentik_providers_proxy.proxyprovider
        id: kino-proxy-provider
        state: present
        identifiers:
          name: kino
        attrs:
          name: kino
          mode: forward_single
          grant_types:
            - authorization_code
          external_host: https://kino.vasary.org
          internal_host: http://kino.media.svc.cluster.vasary.org
          internal_host_ssl_validation: true
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          cookie_domain: vasary.org
          redirect_uris:
            - matching_mode: strict
              url: https://kino.vasary.org/outpost.goauthentik.io/callback?X-authentik-auth-callback=true
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://kino.vasary.org?X-authentik-auth-callback=true
              redirect_uri_type: authorization
      - model: authentik_core.application
        id: kino-application
        state: present
        identifiers:
          slug: kino
        attrs:
          name: Kino Go
          slug: kino
          provider: !KeyOf kino-proxy-provider
          policy_engine_mode: any
          meta_launch_url: https://kino.vasary.org/
          open_in_new_tab: true
      - model: authentik_policies.policybinding
        id: kino-users-policy-binding
        state: present
        identifiers:
          target: !KeyOf kino-application
          group: !KeyOf kino-users-group
          order: 0
        attrs:
          target: !KeyOf kino-application
          group: !KeyOf kino-users-group
          order: 0
