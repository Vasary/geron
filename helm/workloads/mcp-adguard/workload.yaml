apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-adguard
  namespace: mcp
  annotations:
    secret.reloader.stakater.com/reload: adguard-configuration
  labels:
    app.kubernetes.io/name: mcp-adguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-adguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-adguard
    spec:
      containers:
        - name: server
          image: knucklessg1/adguard-home-agent:0.17.0-mcp@sha256:33381e1b49fd19c66e10be47eb560ccc8f3389f8044b6055d5beb9f2d8ba5429
          args:
            - --transport=streamable-http
            - --host=0.0.0.0
            - --port=8000
            - --auth-type=static
            - --static-tokens-ref=env://MCP_STATIC_TOKENS
            - --token-audience=https://mcp-adguard.vasary.org/mcp
            - --tls-terminated
            - --trusted-proxy-cidrs=10.244.0.0/24
            - --allowed-hosts=mcp-adguard.vasary.org
          command:
            - adguard-mcp
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TZ
              value: Europe/Berlin
            - name: MCP_STATIC_TOKENS
              valueFrom:
                secretKeyRef:
                  name: adguard-configuration
                  key: mcp_tokens
            - name: ADGUARD_URL
              valueFrom:
                secretKeyRef:
                  name: adguard-configuration
                  key: url
            - name: ADGUARD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: adguard-configuration
                  key: user
            - name: ADGUARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adguard-configuration
                  key: password
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-adguard
  namespace: mcp
  labels:
    app.kubernetes.io/name: mcp-adguard
spec:
  selector:
    app.kubernetes.io/name: mcp-adguard
  ports:
    - name: http
      port: 3100
      targetPort: http
