apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Vasary Cluster
    description: Cluster welcome board
    theme: dark
    color: zinc
    language: en
    target: _blank
    hideVersion: true
    disableIndexing: true
    showStats: true
    statusStyle: dot
    headerStyle: clean
    cardBlur: xs
    quicklaunch:
      searchDescriptions: true
      provider: google
      showSearchSuggestions: true
      hideVisitURL: false
    layout:
      Finance:
        style: row
        columns: 2
      Quick Links:
        style: row
        columns: 6
      Platform:
        style: row
        columns: 6
      AI:
        style: row
        columns: 4
      Documents:
        style: row
        columns: 6
      Media:
        style: row
        columns: 4
      Apps:
        style: row
        columns: 4
      Cluster Status:
        style: row
        columns: 5
      Observability:
        style: row
        columns: 2

  kubernetes.yaml: |
    mode: cluster
    ingress: true
    traefik: true

  docker.yaml: |
    {}

  widgets.yaml: |
    - search:
        provider: google
        focus: true
        showSearchSuggestions: true
        target: _blank
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster.vasary.org
        nodes:
          show: false
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: medium

  bookmarks.yaml: |
    - News:
        - Hacker News:
            - href: https://news.ycombinator.com/
        - Kubernetes Blog:
            - href: https://kubernetes.io/blog/
        - CNCF Blog:
            - href: https://www.cncf.io/blog/
        - LiteLLM Releases:
            - href: https://github.com/BerriAI/litellm/releases
        - Homepage Releases:
            - href: https://github.com/gethomepage/homepage/releases

  services.yaml: |
    - Finance:
        - USD Rates:
            icon: mdi-currency-usd
            href: https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json
            description: Daily keyless FX snapshot
            widget:
              type: customapi
              url: https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json
              refreshInterval: 3600000
              mappings:
                - field: usd.eur
                  label: EUR
                  format: float
                - field: usd.kgs
                  label: KGS
                  format: float
                - field: usd.rub
                  label: RUB
                  format: float
        - Gold:
            icon: mdi-gold
            href: https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/xau.json
            description: XAU quoted in USD
            widget:
              type: customapi
              url: https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/xau.json
              refreshInterval: 3600000
              mappings:
                - field: xau.usd
                  label: USD / oz
                  format: float
                - field: xau.eur
                  label: EUR / oz
                  format: float

    - Quick Links:
        - Google:
            icon: google.png
            href: https://www.google.com/
            description: Web search
        - Gmail:
            icon: gmail.png
            href: https://mail.google.com/
            description: Mail
        - LinkedIn:
            icon: linkedin.png
            href: https://www.linkedin.com/
            description: Professional network
        - Cloudflare Zero Trust:
            icon: cloudflare.png
            href: https://one.dash.cloudflare.com/
            description: Access, tunnels, policies
        - Cloudflare DNS:
            icon: cloudflare.png
            href: https://dash.cloudflare.com/?to=/:account/:zone/dns
            description: DNS dashboard
        - Pi-hole:
            icon: pi-hole.png
            href: https://dns.cfv3.org/admin/login
            description: Local DNS filtering
            siteMonitor: https://dns.cfv3.org/admin/login
            statusStyle: dot

    - Platform:
        - Argo CD:
            icon: argo-cd.png
            href: https://argocd.vasary.org/
            description: GitOps control plane
            siteMonitor: https://argocd.vasary.org/
            statusStyle: dot
        - Authentik:
            icon: authentik.png
            href: https://auth.vasary.org/
            description: SSO and access policies
            siteMonitor: https://auth.vasary.org/
            namespace: authentik
            app: authentik
            statusStyle: dot
        - Grafana:
            icon: grafana.png
            href: https://grafana.vasary.org/
            description: Metrics and dashboards
            siteMonitor: https://grafana.vasary.org/
            namespace: monitoring
            app: grafana
            statusStyle: dot
        - Prometheus:
            icon: prometheus.png
            href: https://prometheus.vasary.org/
            description: Metrics backend
            siteMonitor: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.vasary.org:9090/-/healthy
            namespace: monitoring
            app: prometheus
            statusStyle: dot

    - AI:
        - LibreChat:
            icon: librechat.png
            href: https://chat.vasary.org/
            description: Chat UI via LiteLLM
            siteMonitor: https://chat.vasary.org/
            namespace: librechat
            app: librechat
            statusStyle: dot
        - LiteLLM:
            icon: openai.png
            href: https://llm-proxy.vasary.org/ui
            description: LLM gateway and model access
            siteMonitor: http://llm-proxy.llm-proxy.svc.cluster.vasary.org:4000/health/liveliness
            namespace: llm-proxy
            app: llm-proxy
            statusStyle: dot

    - Documents:
        - Paperless:
            icon: paperless-ngx.png
            href: https://docs.vasary.org/
            description: Documents and archive
            siteMonitor: https://docs.vasary.org/
            namespace: paperless
            app: paperless
            statusStyle: dot
        - Outline:
            icon: outline.png
            href: https://outline.vasary.org/
            description: Knowledge base
            siteMonitor: https://outline.vasary.org/
            namespace: outline
            app: outline
            statusStyle: dot
        - Seafile:
            icon: seafile.png
            href: https://seafile.vasary.org/
            description: File sync and sharing
            siteMonitor: https://seafile.vasary.org/
            namespace: seafile
            app: seafile
            statusStyle: dot
        - Stirling PDF:
            icon: stirling-pdf.png
            href: https://stirling-pdf.vasary.org/
            description: PDF tools
            siteMonitor: https://stirling-pdf.vasary.org/
            namespace: stirling-pdf
            app: stirling-pdf
            statusStyle: dot

    - Media:
        - Immich:
            icon: immich.png
            href: https://immich.vasary.org/
            description: Photos and videos
            siteMonitor: https://immich.vasary.org/
            namespace: immich
            app: immich
            statusStyle: dot
        - Jellyfin:
            icon: jellyfin.png
            href: https://jellyfin.vasary.org/
            description: Media library
            siteMonitor: https://jellyfin.vasary.org/
            namespace: media
            app: jellyfin
            statusStyle: dot
        - Seasonvar:
            icon: mdi-television-classic
            href: https://seasonvar.vasary.org/
            description: Protected streaming helper
            siteMonitor: https://seasonvar.vasary.org/
            namespace: media
            app: seasonvar
            statusStyle: dot

    - Apps:
        - Vaultwarden:
            icon: vaultwarden.png
            href: https://key.vasary.org/
            description: Password vault
            siteMonitor: https://key.vasary.org/
            namespace: vaultwarden
            app: vaultwarden
            statusStyle: dot
        - Coins Inventory:
            icon: mdi-coins
            href: https://coins-inventory.vasary.org/
            description: Collection inventory
            siteMonitor: https://coins-inventory.vasary.org/
            namespace: coins-inventory
            app: coins-inventory
            statusStyle: dot

    - Cluster Status:
        - Nodes Ready:
            icon: kubernetes.png
            href: https://grafana.vasary.org/
            description: Ready Kubernetes nodes
            widget:
              type: customapi
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.vasary.org:9090/api/v1/query?query=count(kube_node_status_condition%7Bcondition%3D%22Ready%22%2Cstatus%3D%22true%22%7D)
              refreshInterval: 30000
              mappings:
                - field: data.result.0.value.1
                  label: ready
                  format: number
        - Pods Pending:
            icon: kubernetes.png
            href: https://prometheus.vasary.org/
            description: Pods pending, failed, or unknown
            widget:
              type: customapi
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.vasary.org:9090/api/v1/query?query=sum(kube_pod_status_phase%7Bphase%3D~%22Pending%7CFailed%7CUnknown%22%7D)
              refreshInterval: 30000
              mappings:
                - field: data.result.0.value.1
                  label: pods
                  format: number
        - Deployments Unavailable:
            icon: alertmanager.png
            href: https://prometheus.vasary.org/
            description: Unavailable deployment replicas
            widget:
              type: customapi
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.vasary.org:9090/api/v1/query?query=sum(kube_deployment_status_replicas_unavailable)
              refreshInterval: 30000
              mappings:
                - field: data.result.0.value.1
                  label: replicas
                  format: number
        - PVC Storage:
            icon: mdi-harddisk
            href: https://grafana.vasary.org/
            description: Persistent volume claim usage
            widget:
              type: customapi
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.vasary.org:9090/api/v1/query?query=100%20*%20sum(kubelet_volume_stats_used_bytes)%20/%20sum(kubelet_volume_stats_capacity_bytes)
              refreshInterval: 30000
              mappings:
                - field: data.result.0.value.1
                  label: used
                  format: float
                  suffix: "%"
        - Node Filesystems:
            icon: prometheus.png
            href: https://grafana.vasary.org/
            description: Node filesystem usage from Prometheus
            widget:
              type: customapi
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.vasary.org:9090/api/v1/query?query=100%20*%20(1%20-%20(sum(node_filesystem_avail_bytes%7Bfstype!~%22tmpfs%7Coverlay%7Csquashfs%22,mountpoint!~%22/run.*%7C/var/lib/kubelet/pods.*%22%7D)%20/%20sum(node_filesystem_size_bytes%7Bfstype!~%22tmpfs%7Coverlay%7Csquashfs%22,mountpoint!~%22/run.*%7C/var/lib/kubelet/pods.*%22%7D)))
              refreshInterval: 30000
              mappings:
                - field: data.result.0.value.1
                  label: used
                  format: float
                  suffix: "%"

    - Observability:
        - Grafana Storage:
            icon: grafana.png
            href: https://grafana.vasary.org/
            description: Detailed disk, PVC, and node dashboards
            siteMonitor: https://grafana.vasary.org/
            statusStyle: dot
        - Prometheus Targets:
            icon: prometheus.png
            href: https://prometheus.vasary.org/
            description: PromQL, targets, and alerts
            siteMonitor: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.vasary.org:9090/-/healthy
            statusStyle: dot
