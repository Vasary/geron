apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.11
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8096
          env:
            - name: TZ
              value: Europe/Berlin
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: nas-media
              mountPath: /nas
              mountPropagation: HostToContainer
            - name: seasonvar-media
              mountPath: /seasonvar
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 4Gi
        - name: archive-mounter
          image: registry.k8s.io/sig-storage/nfsplugin:v4.13.4
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - /usr/bin/sh
            - -ceu
            - |
              mkdir -p /nas/music /nas/movies

              mount_share() {
                name="$1"
                source="$2"
                target="$3"

                if findmnt -rn --target "$target" >/dev/null 2>&1; then
                  return
                fi

                if timeout 10s mount -t nfs -o nfsvers=4.1,soft,timeo=50,retrans=2,noatime "$source" "$target"; then
                  echo "mounted $name from $source"
                else
                  echo "archive $name is unavailable, keeping $target empty"
                fi
              }

              unmount_if_stale() {
                name="$1"
                target="$2"

                if ! findmnt -rn --target "$target" >/dev/null 2>&1; then
                  return
                fi

                if timeout 10s ls "$target" >/dev/null 2>&1; then
                  return
                fi

                echo "archive $name is stale, unmounting $target"
                timeout 10s umount -l "$target" || true
              }

              while true; do
                unmount_if_stale music /nas/music
                unmount_if_stale movies /nas/movies
                mount_share music 10.10.0.4:/mnt/archive/media/music /nas/music
                mount_share movies 10.10.0.4:/mnt/archive/media/movies /nas/movies
                sleep 30
              done
          volumeMounts:
            - name: nas-media
              mountPath: /nas
              mountPropagation: Bidirectional
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          persistentVolumeClaim:
            claimName: jellyfin-cache
        - name: nas-media
          emptyDir: {}
        - name: seasonvar-media
          persistentVolumeClaim:
            claimName: seasonvar-media
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    geron.io/dns-scope: internal
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - secretName: jellyfin-vasary-tls
      hosts:
        - jellyfin.vasary.org
  rules:
    - host: jellyfin.vasary.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  name: http
