apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-proxy-config
  namespace: llm-proxy
data:
  config.yaml: |
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      store_model_in_db: true
      ui_access_mode: admin_only
      default_team_disabled: true
    litellm_settings:
      drop_params: true
      set_verbose: false
    model_list: []
