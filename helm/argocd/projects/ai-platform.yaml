apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: LibreChat, MCP, and agent platform services
  sourceRepos:
    - '*'
  destinations:
    - namespace: mcp
      server: https://kubernetes.default.svc
    - namespace: librechat
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
