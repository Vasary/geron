apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
spec:
  template:
    spec:
      containers:
        - name: dex
          env:
            - name: PATH
              value: /shared:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          command:
            - /bin/sh
            - -c
            - |
              exec /shared/argocd-dex rundex
      initContainers:
        - name: copy-dex-wrapper
          image: ghcr.io/dexidp/dex:v2.45.0
          command:
            - sh
            - -c
            - |
              cp /usr/local/bin/dex /shared/dex-real
              printf '%s\n' \
                '#!/bin/sh' \
                'if [ "$1" = "serve" ] && [ -n "$2" ]; then' \
                '  grep -q "argocd://auth/callback" "$2" 2>/dev/null || \' \
                '    sed -i "s|  - http://localhost:8085/auth/callback|  - http://localhost:8085/auth/callback\\n  - argocd://auth/callback|" "$2"' \
                'fi' \
                'exec /shared/dex-real "$@"' \
                >/shared/dex
              chmod 0755 /shared/dex /shared/dex-real
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /shared
              name: static-files
        - name: wait-for-authentik
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - |
              url="https://auth.vasary.org/application/o/argocd/.well-known/openid-configuration"
              until curl -fsS --connect-timeout 3 "$url" >/dev/null; do
                echo "waiting for authentik OIDC discovery"
                sleep 5
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
