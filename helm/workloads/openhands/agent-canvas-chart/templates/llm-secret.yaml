{{- if .Values.llmSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.llmSecret.name | default "openhands-secrets" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-canvas.labels" . | nindent 4 }}
type: Opaque
stringData:
  LLM_API_KEY: {{ .Values.llmSecret.llmApiKey | quote }}
{{- end }}
