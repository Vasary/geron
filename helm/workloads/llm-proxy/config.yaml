apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-proxy-config
  namespace: llm-proxy
data:
  config.yaml: |
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      store_model_in_db: true
      ui_access_mode: admin_only
      default_team_disabled: true
      disable_env_credential_login: true
    litellm_settings:
      drop_params: true
      set_verbose: false
    model_list:
      - model_name: jina-v5-small-retrieval
        litellm_params:
          model: openai/jina-v5-small-retrieval
          api_base: http://jina-embeddings.llm-models.svc.cluster.vasary.org/v1
          api_key: no-key
        model_info:
          mode: embedding
          supported_endpoints:
            - /v1/embeddings
          enforce_supported_endpoints: true
      - model_name: qwen3.5-9b-paperless
        litellm_params:
          model: openai/qwen3.5-9b-paperless
          api_base: http://qwen-inference.llm-models.svc.cluster.vasary.org/v1
          api_key: no-key
        model_info:
          mode: chat
          supported_endpoints:
            - /v1/chat/completions
