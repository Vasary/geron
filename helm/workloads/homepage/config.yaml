apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Vasary Cluster
    description: Cluster welcome board
    theme: dark
    color: zinc
    language: en
    target: _blank
    hideVersion: true
    disableIndexing: true
    showStats: false
    statusStyle: dot
    headerStyle: clean
    cardBlur: xs
    quicklaunch:
      searchDescriptions: true
      provider: google
      showSearchSuggestions: true
      hideVisitURL: false
    layout:
      Finance:
        style: row
        columns: 2
      Quick Links:
        style: row
        columns: 4
      Platform:
        style: row
        columns: 6
      AI:
        style: row
        columns: 4
      Documents:
        style: row
        columns: 6
      Media:
        style: row
        columns: 4
      Apps:
        style: row
        columns: 4

  kubernetes.yaml: |
    mode: cluster
    ingress: true
    traefik: true

  docker.yaml: |
    {}

  bookmarks.yaml: |
    []

  widgets.yaml: |
    - search:
        provider: google
        focus: true
        showSearchSuggestions: true
        target: _blank
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: medium

  services.yaml: |
    - Finance:
        - USD Rates:
            icon: mdi-currency-usd
            href: https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json
            description: Daily keyless FX snapshot
            widget:
              type: customapi
              url: https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json
              refreshInterval: 3600000
              mappings:
                - field: usd.eur
                  label: EUR
                  format: float
                - field: usd.kgs
                  label: KGS
                  format: float
                - field: usd.rub
                  label: RUB
                  format: float
        - Gold:
            icon: mdi-gold
            href: https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/xau.json
            description: XAU quoted in USD
            widget:
              type: customapi
              url: https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/xau.json
              refreshInterval: 3600000
              mappings:
                - field: xau.usd
                  label: USD / oz
                  format: float
                - field: xau.eur
                  label: EUR / oz
                  format: float

    - Quick Links:
        - Google:
            icon: google.png
            href: https://www.google.com/
        - Gmail:
            icon: gmail.png
            href: https://mail.google.com/
        - LinkedIn:
            icon: linkedin.png
            href: https://www.linkedin.com/
        - GitHub:
            icon: github.png
            href: https://github.com/
        - YouTube:
            icon: youtube.png
            href: https://www.youtube.com/
        - Cloudflare Zero Trust:
            icon: cloudflare.png
            href: https://one.dash.cloudflare.com/
        - Cloudflare DNS:
            icon: cloudflare.png
            href: https://dash.cloudflare.com/?to=/:account/:zone/dns
        - Pi-hole:
            icon: pi-hole.png
            href: https://dns.vasary.org/admin/login
            siteMonitor: https://dns.vasary.org/admin/login
            statusStyle: dot
        - NAS:
            icon: mdi-nas
            href: https://nas.vasary.org/
            siteMonitor: https://nas.vasary.org/
            statusStyle: dot
        - Frigate:
            icon: frigate.png
            href: https://frigate.vasary.org/
            siteMonitor: http://frigate.media.svc.cluster.vasary.org
            statusStyle: dot

    - Platform:
        - Argo CD:
            icon: argo-cd.png
            href: https://vasary.org/
            description: GitOps control plane
            siteMonitor: http://argocd-server.argocd.svc.cluster.vasary.org
            statusStyle: dot
        - Authentik:
            icon: authentik.png
            href: https://auth.vasary.org/
            description: SSO and access policies
            siteMonitor: http://authentik-server.authentik.svc.cluster.vasary.org
            statusStyle: dot
        - Grafana:
            icon: grafana.png
            href: https://grafana.vasary.org/
            description: Metrics and dashboards
            siteMonitor: https://grafana.vasary.org/
            statusStyle: dot
        - Prometheus:
            icon: prometheus.png
            href: https://prometheus.vasary.org/
            description: Metrics backend
            siteMonitor: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.vasary.org:9090/-/healthy
            statusStyle: dot
        - Hardware Dashboard:
            icon: mdi-cpu-64-bit
            href: https://grafana.vasary.org/d/homelab-hardware-talos
            description: CPU, memory, disks and network
        - Echo Server:
            icon: mdi-network
            href: https://echo.vasary.org/
            description: HTTP and routing diagnostics
            siteMonitor: http://echo-server.echo-server.svc.cluster.vasary.org
            statusStyle: dot

    - AI:
        - LibreChat:
            icon: librechat.png
            href: https://chat.vasary.org/
            description: Chat UI via LiteLLM
            siteMonitor: http://librechat.librechat.svc.cluster.vasary.org:3080/health
            statusStyle: dot
        - LiteLLM:
            icon: openai.png
            href: https://llm-proxy.vasary.org/ui
            description: LLM gateway and model access
            siteMonitor: http://llm-proxy.llm-proxy.svc.cluster.vasary.org/health/liveliness
            statusStyle: dot

    - Documents:
        - Paperless:
            icon: paperless-ngx.png
            href: https://docs.vasary.org/
            description: Documents and archive
            siteMonitor: https://docs.vasary.org/
            statusStyle: dot
        - Outline:
            icon: outline.png
            href: https://outline.vasary.org/
            description: Knowledge base
            siteMonitor: https://outline.vasary.org/
            statusStyle: dot
        - Seafile:
            icon: seafile.png
            href: https://seafile.vasary.org/
            description: File sync and sharing
            siteMonitor: https://seafile.vasary.org/
            statusStyle: dot
        - Stirling PDF:
            icon: stirling-pdf.png
            href: https://stirling-pdf.vasary.org/
            description: PDF tools
            siteMonitor: http://stirling-pdf.stirling-pdf.svc.cluster.vasary.org/login
            statusStyle: dot

    - Media:
        - Immich:
            icon: immich.png
            href: https://immich.vasary.org/
            description: Photos and videos
            siteMonitor: https://immich.vasary.org/
            statusStyle: dot
        - Jellyfin:
            icon: jellyfin.png
            href: https://jellyfin.vasary.org/
            description: Media library
            siteMonitor: http://jellyfin.media.svc.cluster.vasary.org/health
            statusStyle: dot
        - Frigate:
            icon: frigate.png
            href: https://frigate.vasary.org/
            description: Camera NVR
            siteMonitor: http://frigate.media.svc.cluster.vasary.org
            statusStyle: dot
        - Seasonvar:
            icon: mdi-television-classic
            href: https://seasonvar.vasary.org/
            description: Protected streaming helper
            siteMonitor: http://seasonvar.media.svc.cluster.vasary.org/health
            statusStyle: dot

    - Apps:
        - Vikunja:
            icon: vikunja.png
            href: https://todo.vasary.org/
            description: Tasks and projects
            siteMonitor: http://vikunja.vikunja.svc.cluster.vasary.org
            statusStyle: dot
        - Vaultwarden:
            icon: vaultwarden.png
            href: https://key.vasary.org/
            description: Password vault
            siteMonitor: https://key.vasary.org/
            statusStyle: dot
        - Coins Inventory:
            icon: mdi-coins
            href: https://coins-inventory.vasary.org/
            description: Collection inventory
            siteMonitor: http://coins-inventory.coins-inventory.svc.cluster.vasary.org/api/maintenance/health
            statusStyle: dot
        - FreshRSS:
            icon: freshrss.png
            href: https://rss.vasary.org/
            description: RSS reader
            siteMonitor: http://freshrss.freshrss.svc.cluster.vasary.org
            statusStyle: dot
