apiVersion: apps/v1
kind: Deployment
metadata:
  name: jina-embeddings
  namespace: llm-models
  labels:
    app.kubernetes.io/name: jina-embeddings
    app.kubernetes.io/component: inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jina-embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jina-embeddings
        app.kubernetes.io/component: inference
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-b12282@sha256:086942d6ac097c894d9d5bbaf8085c53af85e113fbb9d6d61b3748863c86aa5f
          imagePullPolicy: IfNotPresent
          args:
            - --hf-repo
            - jinaai/jina-embeddings-v5-text-small-retrieval-GGUF
            - --hf-file
            - v5-small-retrieval-Q8_0.gguf
            - --alias
            - jina-v5-small-retrieval
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --embeddings
            - --pooling
            - last
            - --ctx-size
            - "4096"
            - --parallel
            - "2"
            - --threads
            - "2"
            - --threads-batch
            - "2"
            - --batch-size
            - "2048"
            - --ubatch-size
            - "2048"
            - --flash-attn
            - on
            - --no-webui
            - --metrics
          env:
            - name: LLAMA_CACHE
              value: /models
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: model-cache
              mountPath: /models
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 360
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: jina-model-cache
