apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-paperless
  namespace: mcp
  annotations:
    secret.reloader.stakater.com/reload: mcp-credentials
  labels:
    app.kubernetes.io/name: mcp-paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-paperless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-paperless
    spec:
      containers:
        - name: server
          image: docker.io/knucklessg1/paperless-ngx-mcp:mcp
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3101
          env:
            - name: TZ
              value: Europe/Berlin
            - name: TRANSPORT
              value: streamable-http
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3101"
            - name: PAPERLESS_URL
              valueFrom:
                secretKeyRef:
                  name: mcp-credentials
                  key: PAPERLESS_URL
                  optional: true
            - name: PAPERLESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-credentials
                  key: PAPERLESS_TOKEN
                  optional: true
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-paperless
  namespace: mcp
  labels:
    app.kubernetes.io/name: mcp-paperless
spec:
  selector:
    app.kubernetes.io/name: mcp-paperless
  ports:
    - name: http
      port: 3101
      targetPort: http
