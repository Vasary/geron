apiVersion: batch/v1
kind: CronJob
metadata:
  name: seafile-mariadb-backup
  namespace: seafile
  labels:
    geron.io/sftp-backup: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Berlin
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          dnsPolicy: ClusterFirst
          restartPolicy: OnFailure
          schedulerName: default-scheduler
          terminationGracePeriodSeconds: 30
          containers:
            - name: mariadb-dump
              image: docker-registry1.mariadb.com/library/mariadb:11.8.5
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: MARIADB_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: seafile-secrets
                      key: MARIADB_ROOT_PASSWORD
              command:
                - sh
                - -ec
                - |
                  (
                  target_dir=/backup-work/seafile
                  mkdir -p "$target_dir"
                  MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb-dump \
                    --host=seafile-mariadb \
                    --user=root \
                    --single-transaction \
                    --verbose \
                    --databases ccnet_db seafile_db seahub_db \
                    | gzip > "$target_dir/seafile-mariadb-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  ) || { touch /backup-work/.failed; exit 1; }
                  touch /backup-work/.done
              volumeMounts:
                - name: backup-work
                  mountPath: /backup-work
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: backup-work
              emptyDir: {}
