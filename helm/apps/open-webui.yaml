apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: ai-platform
  sources:
    - repoURL: https://github.com/Vasary/geron.git
      targetRevision: master
      path: helm/apps/open-webui
    - repoURL: https://helm.openwebui.com
      chart: open-webui
      targetRevision: 14.6.0
      helm:
        releaseName: open-webui
        values: |
          fullnameOverride: open-webui
          clusterDomain: cluster.vasary.org

          ollama:
            enabled: false
          pipelines:
            enabled: false
          websocket:
            enabled: true
            manager: redis
            url: redis://open-webui-redis.open-webui.svc.cluster.vasary.org:6379/0
            redis:
              enabled: false

          extraEnvVars:
            - name: WEBUI_URL
              value: https://open-webui.vasary.org
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: WEBUI_SECRET_KEY
            - name: REDIS_KEY_PREFIX
              value: open-webui
            - name: CORS_ALLOW_ORIGIN
              value: https://open-webui.vasary.org
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: OPENAI_API_BASE_URLS
              value: https://ollama.com/v1
            - name: OPENAI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: OLLAMA_API_KEY
                  optional: true
            - name: OPENAI_API_CONFIGS
              value: '{"0":{"enable":true,"prefix_id":"ollama-cloud","tags":["ollama","cloud"],"connection_type":"external"}}'
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: ENABLE_OAUTH_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_LOGIN_FORM
              value: "false"
            - name: OAUTH_AUTO_REDIRECT
              value: "true"
            - name: OAUTH_PROVIDER_NAME
              value: Authentik
            - name: OAUTH_CLIENT_ID
              value: open-webui
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: OAUTH_CLIENT_SECRET
            - name: OPENID_PROVIDER_URL
              value: https://auth.vasary.org/application/o/open-webui/.well-known/openid-configuration
            - name: OPENID_REDIRECT_URI
              value: https://open-webui.vasary.org/oauth/oidc/callback
            - name: OAUTH_SCOPES
              value: openid email profile

          ingress:
            enabled: true
            class: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              geron.io/dns-scope: internal
              traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
            host: open-webui.vasary.org
            tls: true
            existingSecret: open-webui-vasary-tls

          persistence:
            enabled: true
            size: 20Gi

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: open-webui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
