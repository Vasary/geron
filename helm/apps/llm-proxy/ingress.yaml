apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-proxy
  namespace: llm-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    geron.io/dns-scope: internal
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - secretName: llm-proxy-vasary-tls
      hosts:
        - llm-proxy.vasary.org
  rules:
    - host: llm-proxy.vasary.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-proxy
                port:
                  name: http
