apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-pihole
  namespace: mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    geron.io/dns-scope: internal
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - secretName: mcp-pihole-vasary-tls
      hosts:
        - mcp-pihole.vasary.org
  rules:
    - host: mcp-pihole.vasary.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-pihole
                port:
                  name: http
