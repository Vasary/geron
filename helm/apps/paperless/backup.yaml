apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-postgres-backup
  namespace: paperless
spec:
  schedule: "35 3 * * *"
  timeZone: Europe/Berlin
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:18-trixie
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: paperless-postgres-local-app
                      key: host
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      name: paperless-postgres-local-app
                      key: port
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: paperless-postgres-local-app
                      key: dbname
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: paperless-postgres-local-app
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: paperless-postgres-local-app
                      key: password
              command:
                - /bin/sh
                - -ec
                - |
                  (
                  target_dir=/backup-work/paperless/postgres
                  mkdir -p "$target_dir"
                  pg_dump --clean --if-exists --no-owner --no-privileges | gzip > "$target_dir/paperless-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  ) || { touch /backup-work/.failed; exit 1; }
                  touch /backup-work/.done
              volumeMounts:
                - name: backup-work
                  mountPath: /backup-work
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
            - name: sftp-upload
              image: rclone/rclone:1.68
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - secretRef:
                    name: sftp-backup-credentials
              command:
                - /bin/sh
                - -ec
                - |
                  while [ ! -f /backup-work/.done ]; do
                    if [ -f /backup-work/.failed ]; then
                      exit 1
                    fi
                    sleep 5
                  done
                  export RCLONE_CONFIG_BACKUP_TYPE=sftp
                  export RCLONE_CONFIG_BACKUP_HOST="$SFTP_HOST"
                  export RCLONE_CONFIG_BACKUP_PORT="$SFTP_PORT"
                  export RCLONE_CONFIG_BACKUP_USER="$SFTP_USER"
                  export RCLONE_CONFIG_BACKUP_PASS="$(rclone obscure "$SFTP_PASSWORD")"
                  rclone copy /backup-work backup:/ --create-empty-src-dirs --stats-one-line
              volumeMounts:
                - name: backup-work
                  mountPath: /backup-work
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: backup-work
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-export-backup
  namespace: paperless
spec:
  schedule: "10 4 * * *"
  timeZone: Europe/Berlin
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
          restartPolicy: OnFailure
          containers:
            - name: document-exporter
              image: ghcr.io/paperless-ngx/paperless-ngx:3.0.4
              imagePullPolicy: IfNotPresent
              env:
                - name: USERMAP_UID
                  value: '568'
                - name: USERMAP_GID
                  value: '568'
                - name: PAPERLESS_TIME_ZONE
                  value: Europe/Berlin
                - name: PAPERLESS_DBENGINE
                  value: postgresql
                - name: PAPERLESS_DBHOST
                  valueFrom:
                    secretKeyRef:
                      name: paperless-postgres-local-app
                      key: host
                - name: PAPERLESS_DBPORT
                  valueFrom:
                    secretKeyRef:
                      name: paperless-postgres-local-app
                      key: port
                - name: PAPERLESS_DBNAME
                  valueFrom:
                    secretKeyRef:
                      name: paperless-postgres-local-app
                      key: dbname
                - name: PAPERLESS_DBUSER
                  valueFrom:
                    secretKeyRef:
                      name: paperless-postgres-local-app
                      key: username
                - name: PAPERLESS_DBPASS
                  valueFrom:
                    secretKeyRef:
                      name: paperless-postgres-local-app
                      key: password
                - name: PAPERLESS_REDIS
                  valueFrom:
                    secretKeyRef:
                      name: paperless-secrets
                      key: PAPERLESS_REDIS
                - name: PAPERLESS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: paperless-secrets
                      key: PAPERLESS_SECRET_KEY
              command:
                - /bin/sh
                - -ec
                - |
                  (
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  target_dir="/backup-work/paperless/export-$stamp"
                  mkdir -p "$target_dir"
                  python manage.py document_exporter --no-progress-bar "$target_dir"
                  ) || { touch /backup-work/.failed; exit 1; }
                  touch /backup-work/.done
              volumeMounts:
                - name: data
                  mountPath: /usr/src/paperless/data
                - name: media
                  mountPath: /usr/src/paperless/media
                - name: backup-work
                  mountPath: /backup-work
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 2Gi
            - name: sftp-upload
              image: rclone/rclone:1.68
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - secretRef:
                    name: sftp-backup-credentials
              command:
                - /bin/sh
                - -ec
                - |
                  while [ ! -f /backup-work/.done ]; do
                    if [ -f /backup-work/.failed ]; then
                      exit 1
                    fi
                    sleep 5
                  done
                  export RCLONE_CONFIG_BACKUP_TYPE=sftp
                  export RCLONE_CONFIG_BACKUP_HOST="$SFTP_HOST"
                  export RCLONE_CONFIG_BACKUP_PORT="$SFTP_PORT"
                  export RCLONE_CONFIG_BACKUP_USER="$SFTP_USER"
                  export RCLONE_CONFIG_BACKUP_PASS="$(rclone obscure "$SFTP_PASSWORD")"
                  rclone copy /backup-work backup:/ --create-empty-src-dirs --stats-one-line
              volumeMounts:
                - name: backup-work
                  mountPath: /backup-work
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: paperless-data
            - name: media
              persistentVolumeClaim:
                claimName: paperless-media
            - name: backup-work
              emptyDir: {}
