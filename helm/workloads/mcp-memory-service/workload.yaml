apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-memory-service
  namespace: mcp
  labels:
    app.kubernetes.io/name: mcp-memory-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-memory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-memory-service
    spec:
      containers:
        - name: server
          image: docker.io/doobidoo/mcp-memory-service:11.10.0-slim
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: MCP_STREAMABLE_HTTP_MODE
              value: "1"
            - name: MCP_SSE_HOST
              value: 0.0.0.0
            - name: MCP_SSE_PORT
              value: "8765"
            - name: MCP_OAUTH_ENABLED
              value: "false"
            - name: MCP_OAUTH_STORAGE_BACKEND
              value: sqlite
            - name: MCP_OAUTH_SQLITE_PATH
              value: /data/oauth.db
            - name: MCP_MEMORY_STORAGE_BACKEND
              value: sqlite_vec
            - name: MCP_MEMORY_SQLITE_PATH
              value: /data/sqlite_vec.db
            - name: MCP_MEMORY_SQLITE_PRAGMAS
              value: journal_mode=WAL,busy_timeout=15000
            - name: TZ
              value: Europe/Berlin
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcp-memory-service-data
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-memory-service
  namespace: mcp
  labels:
    app.kubernetes.io/name: mcp-memory-service
spec:
  selector:
    app.kubernetes.io/name: mcp-memory-service
  ports:
    - name: http
      port: 8765
      targetPort: http
