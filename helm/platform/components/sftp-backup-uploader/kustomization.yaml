apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: batch
      version: v1
      kind: CronJob
      labelSelector: geron.io/sftp-backup=true
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/-
        value:
          name: sftp-upload
          image: rclone/rclone:1.75
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: sftp-backup-credentials
          command:
            - /bin/sh
            - -ec
            - |
              while [ ! -f /backup-work/.done ]; do
                if [ -f /backup-work/.failed ]; then
                  exit 1
                fi
                sleep 5
              done
              export RCLONE_CONFIG=/tmp/rclone.conf
              export RCLONE_CONFIG_BACKUP_TYPE=sftp
              export RCLONE_CONFIG_BACKUP_HOST="$SFTP_HOST"
              export RCLONE_CONFIG_BACKUP_PORT="$SFTP_PORT"
              export RCLONE_CONFIG_BACKUP_USER="$SFTP_USER"
              export RCLONE_CONFIG_BACKUP_PASS="$(rclone obscure "$SFTP_PASSWORD")"
              if rclone copy /backup-work backup:/ --create-empty-src-dirs --stats-one-line \
                --contimeout 10s --timeout 1m --retries 1 --low-level-retries 1; then
                echo "Backup uploaded successfully"
              else
                echo "WARNING: backup upload failed; completing job without a remote backup" >&2
                echo "WARNING: temporary backup files will be lost when this pod is removed" >&2
              fi
          volumeMounts:
            - name: backup-work
              mountPath: /backup-work
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
