apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
spec:
  template:
    spec:
      containers:
        - name: dex
          command:
            - /bin/sh
            - -c
            - |
              (
                last_mtime=""
                while true; do
                  current_mtime="$(stat -c %Y /tmp/dex.yaml 2>/dev/null || true)"
                  if [ -n "$current_mtime" ] && [ "$current_mtime" != "$last_mtime" ]; then
                    last_mtime="$current_mtime"
                    grep -q "argocd://auth/callback" /tmp/dex.yaml 2>/dev/null || \
                      sed -i "s|  - http://localhost:8085/auth/callback|  - http://localhost:8085/auth/callback\\n  - argocd://auth/callback|" /tmp/dex.yaml
                  fi
                  sleep 0.2
                done
              ) &
              exec /shared/argocd-dex rundex
      initContainers:
        - name: wait-for-authentik
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - |
              url="https://auth.vasary.org/application/o/argocd/.well-known/openid-configuration"
              until curl -fsS --connect-timeout 3 "$url" >/dev/null; do
                echo "waiting for authentik OIDC discovery"
                sleep 5
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
