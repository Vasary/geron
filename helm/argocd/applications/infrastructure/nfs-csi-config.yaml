apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-csi-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: platform
  source:
    repoURL: https://github.com/Vasary/geron.git
    targetRevision: master
    path: helm/platform/nfs-csi-config
  destination:
    server: https://kubernetes.default.svc
    namespace: nfs-csi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
