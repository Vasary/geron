apiVersion: batch/v1
kind: CronJob
metadata:
  name: llm-proxy-postgres-backup
  namespace: llm-proxy
spec:
  schedule: "35 3 * * *"
  timeZone: Europe/Berlin
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:18-trixie
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: llm-proxy-postgres-local-app
                      key: host
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      name: llm-proxy-postgres-local-app
                      key: port
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: llm-proxy-postgres-local-app
                      key: dbname
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: llm-proxy-postgres-local-app
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: llm-proxy-postgres-local-app
                      key: password
              command:
                - /bin/sh
                - -ec
                - |
                  (
                  target_dir=/backup-work/llm-proxy
                  mkdir -p "$target_dir"
                  pg_dump --clean --if-exists --no-owner --no-privileges | gzip > "$target_dir/llm-proxy-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  ) || { touch /backup-work/.failed; exit 1; }
                  touch /backup-work/.done
              volumeMounts:
                - name: backup-work
                  mountPath: /backup-work
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
            - name: sftp-upload
              image: alpine:3.22
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsNonRoot: false
                runAsUser: 0
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - secretRef:
                    name: sftp-backup-credentials
              command:
                - /bin/sh
                - -ec
                - |
                  apk add --no-cache lftp
                  while [ ! -f /backup-work/.done ]; do
                    if [ -f /backup-work/.failed ]; then
                      exit 1
                    fi
                    sleep 5
                  done
                  for source_dir in /backup-work/*; do
                    [ -d "$source_dir" ] || continue
                    remote_dir="/$(basename "$source_dir")"
                    lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
                  set sftp:auto-confirm yes
                  set net:max-retries 2
                  set net:timeout 30
                  mirror -R --verbose "$source_dir" "$remote_dir"
                  EOF
                  done
              volumeMounts:
                - name: backup-work
                  mountPath: /backup-work
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: backup-work
              emptyDir: {}
