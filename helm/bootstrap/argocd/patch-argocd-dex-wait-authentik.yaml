apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-authentik
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - |
              url="https://auth.vasary.org/application/o/argocd/.well-known/openid-configuration"
              until curl -fsS --connect-timeout 3 "$url" >/dev/null; do
                echo "waiting for authentik OIDC discovery"
                sleep 5
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
