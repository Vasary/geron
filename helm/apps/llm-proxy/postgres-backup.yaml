apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-proxy-postgres-backups
  namespace: llm-proxy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: backup-nfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: llm-proxy-postgres-backup
  namespace: llm-proxy
spec:
  schedule: "35 3 * * *"
  timeZone: Europe/Berlin
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:18-trixie
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: llm-proxy-postgres-local-app
                      key: host
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      name: llm-proxy-postgres-local-app
                      key: port
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: llm-proxy-postgres-local-app
                      key: dbname
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: llm-proxy-postgres-local-app
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: llm-proxy-postgres-local-app
                      key: password
              command:
                - /bin/sh
                - -ec
                - |
                  target_dir=/backups/llm-proxy
                  mkdir -p "$target_dir"
                  pg_dump --clean --if-exists --no-owner --no-privileges | gzip > "$target_dir/llm-proxy-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  find "$target_dir" -type f -name '*.sql.gz' -mmin +7200 -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: llm-proxy-postgres-backups
