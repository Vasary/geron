apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-inference
  namespace: llm-models
  labels:
    app.kubernetes.io/name: qwen-inference
    app.kubernetes.io/component: inference
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen-inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen-inference
        app.kubernetes.io/component: inference
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-b12282@sha256:086942d6ac097c894d9d5bbaf8085c53af85e113fbb9d6d61b3748863c86aa5f
          imagePullPolicy: IfNotPresent
          args:
            - --hf-repo
            - SoAIHQ/Qwen3.5-4B-GGUF
            - --hf-file
            - Qwen3.5-4B-Q4_K_M.gguf
            - --alias
            - qwen3.5-4b-paperless
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - "8192"
            - --parallel
            - "1"
            - --threads
            - "8"
            - --threads-batch
            - "8"
            - --batch-size
            - "2048"
            - --ubatch-size
            - "512"
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --flash-attn
            - on
            - --jinja
            - --no-webui
            - --metrics
          env:
            - name: LLAMA_CACHE
              value: /models
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: model-cache
              mountPath: /models
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 360
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: qwen-model-cache
