apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: ai-platform
  source:
    repoURL: https://helm.otwld.com/
    chart: ollama
    targetRevision: 1.70.0
    helm:
      releaseName: ollama
      values: |
        fullnameOverride: ollama

        ollama:
          gpu:
            enabled: false
          models:
            pull: []

        persistentVolume:
          enabled: true
          storageClass: local-path
          size: 5Gi

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: ollama
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
