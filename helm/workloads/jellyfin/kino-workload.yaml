apiVersion: apps/v1
kind: Deployment
metadata:
  name: kino
  namespace: media
  labels:
    app.kubernetes.io/name: kino
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kino
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kino
        app.kubernetes.io/component: server
    spec:
      imagePullSecrets:
        - name: ghcr-vasary
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: kino
          image: ghcr.io/vasary/go-kino:v0.1.4
          imagePullPolicy: Always
          args:
            - serve
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: kino-postgres-local-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kino-postgres-local-app
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: kino-postgres-local-app
                  key: dbname
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@kino-postgres-local-rw.media.svc.cluster.vasary.org:5432/$(POSTGRES_DB)?sslmode=disable
            - name: JELLYFIN_URL
              value: http://jellyfin.media.svc.cluster.vasary.org
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: seasonvar-jellyfin
                  key: JELLYFIN_API_KEY
            - name: STREAM_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: seasonvar-jellyfin
                  key: JELLYFIN_API_KEY
            - name: LIBRARY_PATH
              value: /kino
            - name: PUBLIC_URL
              value: https://kino-stream.vasary.org
            - name: SERVER_ADDRESS
              value: 0.0.0.0:8080
            - name: PLAYBACK_CACHE_TTL
              value: 10m
            - name: KINOGO_BASE_URL
              value: https://kinogo.online
            - name: CATALOG_URL
              value: /novinki/
            - name: CATALOG_PAGES
              value: "1"
            - name: WORKER_POLL_INTERVAL
              value: 30s
            - name: REQUEST_PACING
              value: 500ms
            - name: SYNC_REQUEST_DELAY_MIN
              value: 100ms
            - name: SYNC_REQUEST_DELAY_MAX
              value: 500ms
            - name: TZ
              value: Europe/Berlin
          volumeMounts:
            - name: library
              mountPath: /kino
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: kino-media
---
apiVersion: v1
kind: Service
metadata:
  name: kino
  namespace: media
spec:
  selector:
    app.kubernetes.io/name: kino
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
