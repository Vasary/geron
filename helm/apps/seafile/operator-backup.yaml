apiVersion: batch/v1
kind: CronJob
metadata:
  name: seafile-mariadb-backup
  namespace: seafile
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Berlin
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          dnsPolicy: ClusterFirst
          restartPolicy: OnFailure
          schedulerName: default-scheduler
          terminationGracePeriodSeconds: 30
          containers:
            - name: mariadb-dump
              image: docker-registry1.mariadb.com/library/mariadb:11.8.5
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: MARIADB_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: seafile-secrets
                      key: MARIADB_ROOT_PASSWORD
              command:
                - sh
                - -ec
                - |
                  (
                  target_dir=/backup-work/seafile
                  mkdir -p "$target_dir"
                  MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb-dump \
                    --host=seafile-mariadb \
                    --user=root \
                    --single-transaction \
                    --verbose \
                    --databases ccnet_db seafile_db seahub_db \
                    | gzip > "$target_dir/seafile-mariadb-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  ) || { touch /backup-work/.failed; exit 1; }
                  touch /backup-work/.done
              volumeMounts:
                - name: backup-work
                  mountPath: /backup-work
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
            - name: sftp-upload
              image: alpine:3.22
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsNonRoot: false
                runAsUser: 0
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - secretRef:
                    name: sftp-backup-credentials
              command:
                - /bin/sh
                - -ec
                - |
                  apk add --no-cache lftp
                  while [ ! -f /backup-work/.done ]; do
                    if [ -f /backup-work/.failed ]; then
                      exit 1
                    fi
                    sleep 5
                  done
                  for source_dir in /backup-work/*; do
                    [ -d "$source_dir" ] || continue
                    remote_dir="/$(basename "$source_dir")"
                    lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
                  set sftp:auto-confirm yes
                  set net:max-retries 2
                  set net:timeout 30
                  mirror -R --verbose "$source_dir" "$remote_dir"
                  EOF
                  done
              volumeMounts:
                - name: backup-work
                  mountPath: /backup-work
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: backup-work
              emptyDir: {}
