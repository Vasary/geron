apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-adguard
  namespace: mcp
  annotations:
    secret.reloader.stakater.com/reload: adguard-configuration
  labels:
    app.kubernetes.io/name: mcp-adguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-adguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-adguard
    spec:
      initContainers:
        - name: install-mcp
          image: supercorp/supergateway:4.2.2@sha256:5fd78fb79ffce27812313e5da9b3b3d0bc034267e131961f1140f4a4e0179d3a
          command:
            - npm
          args:
            - install
            - --prefix=/opt/mcp
            - --ignore-scripts
            - --no-audit
            - --no-fund
            - '@fcannizzaro/mcp-adguard-home@1.0.6'
          volumeMounts:
            - name: mcp-package
              mountPath: /opt/mcp
      containers:
        - name: server
          image: supercorp/supergateway:4.2.2@sha256:5fd78fb79ffce27812313e5da9b3b3d0bc034267e131961f1140f4a4e0179d3a
          args:
            - --stdio
            - node /opt/mcp/node_modules/@fcannizzaro/mcp-adguard-home/dist/index.mjs
            - --outputTransport=streamableHttp
            - --stateful
            - --host=0.0.0.0
            - --port=8000
            - --healthEndpoint=/healthz
          volumeMounts:
            - name: mcp-package
              mountPath: /opt/mcp
              readOnly: true
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TZ
              value: Europe/Berlin
            - name: SUPERGATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: adguard-configuration
                  key: mcp_api_key
            - name: ADGUARD_URL
              valueFrom:
                secretKeyRef:
                  name: adguard-configuration
                  key: url
            - name: ADGUARD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: adguard-configuration
                  key: user
            - name: ADGUARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adguard-configuration
                  key: password
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: mcp-package
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-adguard
  namespace: mcp
  labels:
    app.kubernetes.io/name: mcp-adguard
spec:
  selector:
    app.kubernetes.io/name: mcp-adguard
  ports:
    - name: http
      port: 3100
      targetPort: http
