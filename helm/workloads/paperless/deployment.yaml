apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
  labels:
    app.kubernetes.io/name: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
  template:
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: paperless-secrets
      labels:
        app.kubernetes.io/name: paperless
    spec:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: USERMAP_UID
              value: '568'
            - name: USERMAP_GID
              value: '568'
            - name: PAPERLESS_PORT
              value: '80'
            - name: PAPERLESS_URL
              value: https://docs.vasary.org
            - name: PAPERLESS_ALLOWED_HOSTS
              value: docs.vasary.org,paperless,localhost
            - name: PAPERLESS_CORS_ALLOWED_HOSTS
              value: https://docs.vasary.org,http://localhost:8000,http://paperless:80
            - name: PAPERLESS_CSRF_TRUSTED_ORIGINS
              value: https://docs.vasary.org,http://localhost:8000,http://paperless:80
            - name: PAPERLESS_USE_X_FORWARD_HOST
              value: 'true'
            - name: PAPERLESS_LOGOUT_REDIRECT_URL
              value: https://auth.vasary.org/application/o/paperless/end-session/
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Berlin
            - name: PAPERLESS_OCR_LANGUAGE
              value: deu
            - name: PAPERLESS_OCR_LANGUAGES
              value: rus eng deu ukr kir
            - name: PAPERLESS_OCR_USER_ARGS
              value: '{"continue_on_soft_render_error": true}'
            - name: PAPERLESS_TASK_WORKERS
              value: '1'
            - name: PAPERLESS_THREADS_PER_WORKER
              value: '1'
            - name: PAPERLESS_CONSUMER_AUTO_IMPORT
              value: 'true'
            - name: PAPERLESS_CONSUMER_POLLING
              value: '60'
            - name: PAPERLESS_CONSUMER_RECURSIVE
              value: '1'
            - name: PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS
              value: '1'
            - name: PAPERLESS_DBENGINE
              value: postgresql
            - name: PAPERLESS_DBHOST
              valueFrom:
                secretKeyRef:
                  name: paperless-postgres-local-app
                  key: host
            - name: PAPERLESS_DBPORT
              valueFrom:
                secretKeyRef:
                  name: paperless-postgres-local-app
                  key: port
            - name: PAPERLESS_DBNAME
              valueFrom:
                secretKeyRef:
                  name: paperless-postgres-local-app
                  key: dbname
            - name: PAPERLESS_DBUSER
              valueFrom:
                secretKeyRef:
                  name: paperless-postgres-local-app
                  key: username
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-postgres-local-app
                  key: password
            - name: PAPERLESS_REDIS
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_REDIS
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_SECRET_KEY
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_SOCIALACCOUNT_PROVIDERS
            - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
              value: 'true'
            - name: PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS
              value: 'true'
            - name: PAPERLESS_DISABLE_REGULAR_LOGIN
              value: 'true'
            - name: PAPERLESS_REDIRECT_LOGIN_TO_SSO
              value: 'true'
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
          startupProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: docs.vasary.org
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: docs.vasary.org
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: docs.vasary.org
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
